<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" 
      th:fragment="layout(title, content)" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <th:block th:replace="${title}"></th:block>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        main {
            flex: 1;
            padding: 2rem 0;
        }
        footer {
            background-color: #f8f9fa;
            border-top: 1px solid #dee2e6;
            padding: 2rem 0;
            margin-top: 3rem;
        }
        .navbar-brand {
            font-weight: 600;
            font-size: 1.5rem;
        }
        .invalid-feedback {
            display: block;
        }
        .logout-form {
            display: inline;
            margin: 0;
        }
        .logout-btn {
            padding: 0.375rem 0.75rem;
            font-size: 0.875rem;
        }
        .user-info {
            color: #fff;
            margin-right: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/cursos}">
                <strong>OTEC Admin</strong>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/cursos}">
                            Cursos
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/relatores}">
                            Relatores
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/cursos/inactivos}">
                            Archivo
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <div class="user-info">
                            <span sec:authentication="name">Usuario</span>
                            <form th:action="@{/logout}" method="post" class="logout-form">
                                <button type="submit" class="btn btn-outline-light btn-sm logout-btn">
                                    Cerrar Sesión
                                </button>
                            </form>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container" th:insert="${content}"></main>

    <!-- Footer -->
    <footer class="mt-5">
        <div class="container-fluid text-center text-muted small">
            <p>&copy; 2026 Sistema de Gestión OTEC. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
